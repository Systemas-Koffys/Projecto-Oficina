# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - name: Deploy to Firebase Hosting (Live Channel)
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SISTEMA_ARBORICULTURA_TARIJA }}
        run: |
          echo "$FIREBASE_KEY" > service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=service-account.json
          
          # Ejecutar deploy y capturar salida
          set +e
          npx firebase-tools deploy --only hosting,firestore:rules --project sistema-arboricultura-tarija > deploy_output.log 2>&1
          DEPLOY_EXIT_CODE=$?
          set -e
          
          # Mostrar la salida en la consola
          cat deploy_output.log
          
          # Verificar si falló pero es por la versión activa
          if [ $DEPLOY_EXIT_CODE -ne 0 ]; then
            if grep -q "is the current active version" deploy_output.log; then
              echo "✅ Despliegue completado con éxito (la versión ya está activa en Firebase)."
              DEPLOY_EXIT_CODE=0
            else
              echo "❌ Error real durante el despliegue."
            fi
          fi
          
          rm service-account.json deploy_output.log
          exit $DEPLOY_EXIT_CODE
